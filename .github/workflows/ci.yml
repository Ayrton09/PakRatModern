name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core and GUI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      # La referencia de paridad la genera el CLI de Python. Se regenera aqui y
      # se compara con la commiteada: si el escritor Python cambio y nadie
      # actualizo el hash, el diff lo delata antes que el test de C#. Son dos
      # pasos porque con pwsh solo cuenta el codigo de salida del ultimo
      # comando: juntos, un fallo del generador pasaba sin que nadie lo viera.
      - name: Regenerate CLI parity reference
        run: python tools/make_pak_reference.py

      - name: Check the committed parity reference
        run: git diff --exit-code -- src/testdata/reference-pak.sha256

      - name: Core tests (net472)
        run: dotnet run --project src/PakRatModern.Tests/PakRatModern.Tests.csproj -c Release -f net472 -v q --nologo

      - name: Build application
        run: dotnet build src/PakRatModern.App/PakRatModern.App.csproj -c Release -v q --nologo -p:ContinuousIntegrationBuild=true

  cli:
    name: CLI (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.8 es la version minima que promete el README; en Linux ademas corre
        # el test de permisos de archivo, que en Windows no aplica. Ubuntu va
        # fijo en 24.04: es la imagen mas nueva con builds de Python 3.8.
        os: [windows-latest, ubuntu-24.04]
        python: ["3.8", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: CLI tests
        run: python -m unittest discover -s tests -v
