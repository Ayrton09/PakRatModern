name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # La referencia de paridad la genera el CLI de Python. Se regenera aqui y
      # se compara con la commiteada: si el escritor Python cambio y nadie
      # actualizo el hash, el diff lo delata antes que el test de C#.
      - name: Regenerate CLI parity reference
        run: |
          python tools/make_pak_reference.py
          git diff --exit-code -- src/testdata/reference-pak.sha256

      - name: Python CLI tests
        run: python -m unittest discover -s tests -v

      - name: Core tests (net472)
        run: dotnet run --project src/PakRatModern.Tests/PakRatModern.Tests.csproj -c Release -f net472 -v q --nologo

      - name: Build application
        run: dotnet build src/PakRatModern.App/PakRatModern.App.csproj -c Release -v q --nologo
